# Remote Arch Linux tmux config.
# Install path on Arch PC: ~/.config/tmux/tmux.conf

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",tmux-256color:RGB"
set -as terminal-features ',foot:RGB,xterm-ghostty:RGB'
set -g history-limit 100000
set -s escape-time 0
set -g focus-events on
set -g mouse on
# 默认 Wheel 是 -N 5；配合终端滚轮倍数会跳页，压到 1 行/事件
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind -T copy-mode    WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# Pi：在原始 tmux scrollback 中按“最终结果/结论”跳转，不打开第二个阅读页面。
# Thinking、Working 和中间工具调用会被跳过。普通界面的 Ctrl+Up 由 Pi 扩展
# 触发；进入 copy-mode 后继续跳到上一/下一条结果，最新结果后 Ctrl+Down 回到底部。
# 辅助脚本属于可选的本地 Pi 配置；未安装时不注册这些 copy-mode 绑定。
if-shell '[ -x "$HOME/.pi/agent/bin/pi-turn-scroll" ]' {
  bind -T copy-mode-vi C-Up   run-shell '"$HOME"/.pi/agent/bin/pi-turn-scroll up "#{pane_id}"'
  bind -T copy-mode-vi C-Down run-shell '"$HOME"/.pi/agent/bin/pi-turn-scroll down "#{pane_id}"'
  bind -T copy-mode    C-Up   run-shell '"$HOME"/.pi/agent/bin/pi-turn-scroll up "#{pane_id}"'
  bind -T copy-mode    C-Down run-shell '"$HOME"/.pi/agent/bin/pi-turn-scroll down "#{pane_id}"'
}
bind -T copy-mode-vi Escape send-keys -X cancel

unbind C-b
set -g prefix M-s
bind-key M-s send-prefix
# Prefix + t：设置当前 pane 的标题
bind-key t command-prompt -p "Pane title" "select-pane -T '%%'"
# 允许终端内应用（nvim 等）自己设置系统剪贴板。默认值 external 只允许 tmux
# 自己设置，会丢弃应用发来的 OSC 52，导致 tmux 内 nvim 的 yank 出不了 tmux。
# 注意：foot 只在窗口有键盘焦点时才接受 OSC 52 写入。
set -g set-clipboard on
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection
set -g allow-passthrough on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g detach-on-destroy off

# --- QWERTY Alt Navigation (No Prefix) ---
# 面板切换 (直接按 Alt + h/j/k/l)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# 窗口管理 (直接按 Alt + ...)
# extended-keys 下 Alt+Shift+X 的键名是 M-S-<字符> 而不是 M-X：
# 上报基码点的终端是 M-S-q，上报移位后码点的终端（foot）是 M-S-Q，两种都绑。
bind -n M-o new-window -c "#{pane_current_path}"
bind -n M-q kill-pane

# 窗口切换 (直接按 Alt + 1..9)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# 全屏 (Zoom)
bind -n M-f resize-pane -Z

# 自动平铺当前 window 中的所有 pane
bind -n M-a select-layout tiled

# 调整面板大小 (Alt + Shift + Up/Down/Left/Right)
bind -n M-S-Left resize-pane -L 5
bind -n M-S-Down resize-pane -D 5
bind -n M-S-Up resize-pane -U 5
bind -n M-S-Right resize-pane -R 5

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy --trim --type text/plain"

# 重载配置 (Alt + r)
bind -n M-r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# --- 面板创建：方向化 (需要 Prefix: Alt+s) ---

# 逻辑：Prefix(Alt+s) 之后按方向键，在对应位置开新面板
bind h split-window -h -b -c "#{pane_current_path}"
bind l split-window -h -c "#{pane_current_path}"
bind k split-window -v -b -c "#{pane_current_path}"
bind j split-window -v -c "#{pane_current_path}"

bind -r H resize-pane -L 5

bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5
bind z resize-pane -Z

# Modified-key forwarding for modern terminal applications.
set -g extended-keys on
set -g extended-keys-format csi-u

source-file ~/.config/theme/current/tmux/theme.conf
