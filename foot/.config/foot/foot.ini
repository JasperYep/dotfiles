# -*- conf -*-
# Shared foot settings. Both color themes live here; theme-switch picks the
# initial one through ~/.config/theme/current/foot/theme.ini and switches
# running instances with SIGUSR1 (dark) / SIGUSR2 (light).

[main]
include=~/.config/theme/current/foot/theme.ini
font=Maple Mono NF CN:size=11
font-bold=Maple Mono NF CN:size=11:weight=bold
font-italic=Maple Mono NF CN:size=11:slant=italic
font-bold-italic=Maple Mono NF CN:size=11:weight=bold:slant=italic
pad=18x18 center
resize-by-cells=no

[cursor]
style=beam
blink=no
beam-thickness=1.5

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000
multiplier=3.0
indicator-position=none

[url]
launch=xdg-open ${url}

[colors-light]
foreground=575279
background=faf4ed

## Cursor
cursor=faf4ed 575279

## Normal colors
regular0=f2e9e1
regular1=b4637a
regular2=286983
regular3=ea9d34
regular4=56949f
regular5=907aa9
regular6=d7827e
regular7=575279

## Bright colors
bright0=9893a5
bright1=b4637a
bright2=286983
bright3=ea9d34
bright4=56949f
bright5=907aa9
bright6=d7827e
bright7=575279

## Selection
selection-foreground=575279
selection-background=dfdad9

## URL & search
urls=56949f
search-box-no-match=dfdad9 b4637a
search-box-match=575279 dfdad9
jump-labels=faf4ed ea9d34

[colors-dark]
foreground=e0def4
background=232136

## Cursor
cursor=232136 e0def4

## Normal colors
regular0=393552
regular1=eb6f92
regular2=3e8fb0
regular3=f6c177
regular4=9ccfd8
regular5=c4a7e7
regular6=ea9a97
regular7=e0def4

## Bright colors
bright0=6e6a86
bright1=eb6f92
bright2=3e8fb0
bright3=f6c177
bright4=9ccfd8
bright5=c4a7e7
bright6=ea9a97
bright7=e0def4

## Selection
selection-foreground=e0def4
selection-background=44415a

## URL & search
urls=9ccfd8
search-box-no-match=393552 eb6f92
search-box-match=e0def4 44415a
jump-labels=232136 f6c177
