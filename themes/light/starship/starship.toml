"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$directory\
$git_branch\
$git_status\
$python\
$cmd_duration\
$line_break\
$character"""

[os]
format = "[$symbol]($style)"
style = "bold blue"
disabled = false

[os.symbols]
Arch = " "

[directory]
style = "bold #575279"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "#907aa9"
format = "[$symbol$branch]($style) "

[git_status]
style = "#b4637a"
format = '([$all_status$ahead_behind]($style) )'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
untracked = "?${count}"
staged = "+${count}"

[python]
symbol = " "
style = "#ea9d34"
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[cmd_duration]
min_time = 2_000
style = "#9893a5"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](#907aa9)"
error_symbol = "[❯](#b4637a)"
