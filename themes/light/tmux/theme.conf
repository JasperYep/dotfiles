set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#9893a5"
set -g window-status-format " #{window_index} #W "
set -g window-status-current-format " #[bold]#{window_index} #W "
set -g window-status-current-style "bg=#907aa9,fg=#faf4ed"
set -g status-left " #S "
set -g status-left-style "bg=default,fg=#907aa9"
set -g status-right " %Y-%m-%d %H:%M "
set -g status-right-style "bg=default,fg=#9893a5"
set -g message-style "bg=#907aa9,fg=#faf4ed"
set -g pane-border-style "fg=#faf4ed"
set -g pane-active-border-style "fg=#907aa9"
setw -g pane-border-status top
setw -g pane-border-format " #{?pane_active,#[fg=#faf4ed#,bg=#907aa9#,bold],#[fg=#9893a5#,bg=default]} #P: #{pane_title} "
