set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#6e6a86"
set -g window-status-format " #{window_index} #W "
set -g window-status-current-format " #[bold]#{window_index} #W "
set -g window-status-current-style "bg=#c4a7e7,fg=#232136"
set -g status-left " #S "
set -g status-left-style "bg=default,fg=#c4a7e7"
set -g status-right " %Y-%m-%d %H:%M "
set -g status-right-style "bg=default,fg=#6e6a86"
set -g message-style "bg=#c4a7e7,fg=#232136"
set -g pane-border-style "fg=#44415a"
set -g pane-active-border-style "fg=#c4a7e7"
setw -g pane-border-status top
setw -g pane-border-format " #{?pane_active,#[fg=#232136#,bg=#c4a7e7#,bold],#[fg=#6e6a86#,bg=default]} #P: #{pane_title} "
